name: Build zeeload
on:
  workflow_dispatch: # 手动点击运行（最常用）
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [arm64, amd64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 编译
        run: |
          go build -ldflags "-s -w" -trimpath -o zeeload-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zeeload-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zeeload-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部编译文件
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 自动发布Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
